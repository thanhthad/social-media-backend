# ================= LOGGING =================
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.web.servlet.mvc.method.annotation=ERROR
logging.level.org.springframework.validation=ERROR
spring.mvc.log-resolved-exception=false

# ================= PROFILE =================
spring.profiles.active=local

# ================= JPA =================
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# ================= SWAGGER =================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ================= JWT =================
jwt.secret=${JWT_SECRET}
jwt.access-expiration=9900000
jwt.refresh-expiration=604800000

# ================= CLOUDINARY =================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ================= MULTIPART / FILE UPLOADS =================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ================= MEDIA UPLOAD POLICIES =================
# Image limits (shared across all contexts)
media.upload.image.max-size-bytes=5242880
media.upload.image.allowed-extensions=jpg,jpeg,png,webp

# Video extensions (shared across all contexts)
media.upload.video.allowed-extensions=mp4,mov,avi,mkv,webm

# Per-context video limits
media.upload.policies.post.max-video-size-bytes=314572800
media.upload.policies.post.max-video-duration-seconds=600

media.upload.policies.story.max-video-size-bytes=104857600
media.upload.policies.story.max-video-duration-seconds=30

media.upload.policies.message.max-video-size-bytes=52428800
media.upload.policies.message.max-video-duration-seconds=300

# Profile: image-only callers (avatar, cover, group avatar, dating photos)
# max-video-duration-seconds=0 means no duration enforcement
media.upload.policies.profile.max-video-size-bytes=314572800
media.upload.policies.profile.max-video-duration-seconds=0

media.upload.policies.reel.max-video-size-bytes=314572800
media.upload.policies.reel.max-video-duration-seconds=300

# ================= OAuth2 Google Login =================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ================= MAIL =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG